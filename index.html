<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/index.css">
    <title>Home</title>
</head>

<body>

    <header class="tit">
        <h1>GuitarFur</h1>

        <div>
            <button class="cor">Claro</button>
        </div>
    </header>

    <div class="g-area">
        <div class="area-anim">
            <img src="" alt="">
        </div>
    </div>

    <div class="conteudo-de-cadastro">
        <div class="modal-conteudo">
            <span class="fechar" id="fecharModal">&time;</span>
            <h2>Adicionar Guitarra</h2>
            <form>

                <label>Serie</label>
                <input type="text">

                <label for="Marcas">Marcas</label>
                <select id="">
                    <option value="">Selecionar Marca</option>
                    <option value="Tagima">Tagima</option>
                    <option value="Fender">Fender</option>
                    <option value="Gianini">Gianini</option>
                    <option value="Gibson">Gibson</option>
                    <option value="Strinberg">Strinberg</option>
                </select>

                 <label for="modelo">Modelo</label>
                <select id="">
                    <option value="">Selecionar Modelo</option>
                    <option value="Stratocaster">Stratocaster</option>
                    <option value="Lespaul">Lespaul</option>
                    <option value="Telecaster">Telecaster</option>
                    <option value="SuperStrato">SuperStrato</option>
                    <option value="Telecaster">Telecaster</option>
                </select>

                <button></button>
            </form>
        </div>
    </div>

    <div class="navegacao">
        <button id="card" class="card-1" title="cadastro"></button>
        <div id="card" class="card-2"></div>
        <div id="card" class="card-3"></div>
    </div>

    <script src="./js/script.js"></script>

</body>

</html>
